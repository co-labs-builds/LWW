<section class="lm-login__panel">
  <div class="lm-login__form-wrap">
    <h2 class="lm-login__welcome">Welcome back<span class="lm-login__dot">.</span></h2>
    <p class="lm-login__subhead">Sign in with your Landmark account to pick up where you left off.</p>

    <!-- LNK-001: replace with Ontraport membership login form action/handler (TBD) -->
    <form class="lm-login__form" onsubmit="return false;">
      <div class="lm-login__field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@email.com">
      </div>
      <div class="lm-login__field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="............">
      </div>
      <button class="lm-login__btn" type="submit">Log In</button>
    </form>

    <div class="lm-login__help">
      <p>First time here, or forgot your password?</p>
      <!-- LNK-002: replace href with Ontraport password-reset / setup URL (TBD) -->
      <a href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Password help
      </a>
    </div>
  </div>

  <!-- LNK-003: confirm final support email / phone -->
  <div class="lm-login__foot">
    <span>Landmark Worldwide</span><br>
    info@landmarkworldwide.com &nbsp;&#183;&nbsp; +1 (800) 888-9590
  </div>
</section>
