<div class="lm-portal-login__inner">

  <!-- Stage: branded photographic column -->
  <section class="lm-portal-login__stage">
    <img class="lm-portal-login__brand-logo" src="TBD_ONTRAPORT_ASSET_URL/landmark-logo-white.png" alt="Landmark">
    <div class="lm-portal-login__stage-copy">
      <div class="lm-portal-login__eyebrow">Welcome to your</div>
      <h1 class="lm-portal-login__title">Member Portal</h1>
      <div class="lm-portal-login__rule"></div>
    </div>
  </section>

  <!-- Panel: sign-in column -->
  <section class="lm-portal-login__panel">
    <div class="lm-portal-login__form-wrap">
      <h2 class="lm-portal-login__welcome">Welcome back<span class="lm-portal-login__dot">.</span></h2>
      <p class="lm-portal-login__subhead">Sign in with your Landmark account to pick up where you left off.</p>

      <form class="lm-portal-login__form" onsubmit="return false;">
        <div class="lm-portal-login__field">
          <label for="lm-portal-login-email">Email</label>
          <input id="lm-portal-login-email" type="email" autocomplete="username" placeholder="you@email.com">
        </div>
        <div class="lm-portal-login__field">
          <label for="lm-portal-login-password">Password</label>
          <input id="lm-portal-login-password" type="password" autocomplete="current-password" placeholder="............">
        </div>
        <button class="lm-btn lm-portal-login__btn" type="submit">Log In</button>
      </form>

      <div class="lm-portal-login__help">
        <p>First time here, or forgot your password?</p>
        <a href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Password help
        </a>
      </div>
    </div>

    <div class="lm-portal-login__foot">
      <span>Landmark Worldwide</span><br>
      info@landmarkworldwide.com &nbsp;&#183;&nbsp; +1 (800) 888-9590
    </div>
  </section>

</div>
